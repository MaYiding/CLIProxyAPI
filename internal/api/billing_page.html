<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CLIProxyAPI</title>
  <style nonce="{{NONCE}}">
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-primary, #2d2a26);
      background: var(--bg-secondary, #faf9f5);
      font-synthesis: none;
      --surface: var(--bg-primary, #f0eee8);
      --surface-subtle: var(--bg-secondary, #faf9f5);
      --surface-hover: var(--bg-hover, #e8e5de);
      --border: var(--border-color, #e3e1db);
      --muted: var(--text-secondary, #6d6760);
      --text: var(--text-primary, #2d2a26);
      --accent: var(--primary-color, #77716a);
      --accent-strong: var(--primary-hover, #625d57);
      --success: var(--success-color, #0f8a62);
      --warning: var(--warning-color, #b7791f);
      --danger: var(--error-color, #c65746);
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body { margin: 0; color: var(--text); background: var(--surface-subtle); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .shell { width: min(1440px, 100%); margin: 0 auto; padding: 72px clamp(18px, 3vw, 42px) 36px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 10px; color: var(--accent); font-weight: 800; background: var(--surface); box-shadow: var(--shadow); }
    h1 { margin: 0; font-size: clamp(1.3rem, 2.5vw, 1.85rem); letter-spacing: -.03em; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: .86rem; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md, 12px); box-shadow: var(--shadow); }
    .button { min-height: 38px; border: 1px solid transparent; border-radius: 8px; padding: 8px 13px; color: var(--primary-contrast, #fff); font-weight: 680; background: var(--accent); }
    .button:hover { background: var(--accent-strong); }
    .button.secondary { color: var(--text); background: var(--surface); border-color: var(--border); }
    .button.secondary:hover { background: var(--surface-hover); }
    .button:disabled { cursor: not-allowed; opacity: .58; }
    .notice { margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; color: var(--muted); background: var(--surface); line-height: 1.45; }
    .notice.error { color: var(--warning-text, var(--danger)); border-color: var(--warning-border, var(--border)); background: var(--warning-bg, var(--surface)); }
    .tabs { display: flex; gap: 4px; padding: 5px; margin-bottom: 16px; overflow-x: auto; }
    .tab { min-width: max-content; border: 0; border-radius: 8px; padding: 9px 16px; color: var(--muted); font-weight: 700; background: transparent; }
    .tab:hover { color: var(--text); background: var(--surface-hover); }
    .tab[aria-selected="true"] { color: var(--text); background: var(--surface-subtle); box-shadow: inset 0 0 0 1px var(--border); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { min-width: 0; padding: 15px 16px; }
    .card-label { color: var(--muted); font-size: .75rem; font-weight: 720; letter-spacing: .035em; }
    .card-value { display: block; margin-top: 7px; font-size: clamp(1.15rem, 2vw, 1.55rem); font-weight: 780; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .card-meta { margin-top: 4px; color: var(--muted); font-size: .76rem; }
    .section { margin-bottom: 16px; overflow: hidden; }
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 17px 12px; }
    .section-header h2 { margin: 0; font-size: 1rem; }
    .section-hint, .section-meta { color: var(--muted); font-size: .78rem; }
    .section-hint { margin-top: 3px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; min-width: 720px; border-collapse: collapse; }
    th, td { padding: 11px 13px; border-top: 1px solid var(--border); text-align: left; vertical-align: middle; white-space: nowrap; font-size: .82rem; }
    th { color: var(--muted); background: var(--surface-subtle); font-size: .71rem; letter-spacing: .03em; }
    td.numeric, th.numeric { text-align: right; }
    tbody tr:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
    label { display: grid; gap: 6px; color: var(--text); font-size: .83rem; font-weight: 650; }
    input, select { min-width: 0; width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); background: var(--surface-subtle); outline: none; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    .key-table { min-width: 940px; }
    .key-table .identity { min-width: 270px; white-space: normal; }
    .key-name-input { max-width: 250px; margin-bottom: 7px; font-weight: 650; }
    .key-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .key-value { display: inline-block; max-width: 230px; overflow: hidden; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .74rem; text-overflow: ellipsis; white-space: nowrap; }
    .key-value.revealed { flex: 1 1 auto; max-width: 100%; overflow: visible; color: var(--text); overflow-wrap: anywhere; text-overflow: clip; white-space: normal; }
    .reveal-button { display: inline-grid; place-items: center; width: 30px; height: 28px; flex: 0 0 auto; border: 1px solid var(--border); border-radius: 7px; padding: 0; color: var(--muted); background: transparent; }
    .reveal-button:hover { color: var(--text); background: var(--surface-hover); }
    .reveal-button svg { width: 16px; height: 16px; }
    .limit-input { width: 120px; margin-left: auto; text-align: right; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 8px; color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); font-size: .71rem; font-weight: 720; }
    .badge.blocked { color: var(--danger); background: color-mix(in srgb, var(--danger) 11%, transparent); }
    .badge.unlimited { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
    .empty { padding: 25px 18px; border-top: 1px solid var(--border); color: var(--muted); text-align: center; }
    .actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 13px 17px 16px; border-top: 1px solid var(--border); }
    .status { min-height: 20px; flex: 1; color: var(--muted); font-size: .82rem; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .filters { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 11px; padding: 16px; margin-bottom: 16px; }
    .filter-actions { display: flex; align-items: end; gap: 7px; }
    .filter-actions .button { flex: 1; }
    .usage-summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pagination { display: flex; align-items: center; justify-content: flex-end; gap: 9px; padding: 13px 17px 15px; border-top: 1px solid var(--border); }
    .pagination span { color: var(--muted); font-size: .8rem; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 4px 17px 17px; }
    .setting-toggle { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-subtle); }
    .setting-toggle input { width: 18px; height: 18px; margin: 0; }
    .setting-toggle span { display: grid; gap: 2px; }
    .field-hint, .setting-toggle small { color: var(--muted); font-size: .73rem; font-weight: 500; }
    .readonly-value { min-height: 40px; padding: 10px 11px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); background: var(--surface-subtle); overflow-wrap: anywhere; }
    .advanced { border-top: 1px solid var(--border); }
    .advanced summary { cursor: pointer; padding: 14px 17px; font-weight: 720; }
    .advanced summary small { display: block; margin-top: 3px; color: var(--muted); font-size: .73rem; font-weight: 500; }
    .rules-toolbar { display: flex; justify-content: flex-end; padding: 0 17px 10px; }
    .rules-table { min-width: 1460px; }
    .rules-table input, .rules-table select { min-width: 100px; padding: 7px 8px; }
    .remove-rule { min-height: 32px; border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--border)); border-radius: 7px; padding: 6px 9px; color: var(--danger); background: transparent; }
    .footer { padding: 4px 0 10px; color: var(--muted); font-size: .75rem; text-align: center; }
    @media (max-width: 1000px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .filter-actions { grid-column: span 1; }
    }
    @media (max-width: 720px) {
      .shell { padding: 76px 13px 26px; }
      .topbar { align-items: flex-start; }
      .subtitle { max-width: 250px; }
      .tabs { position: sticky; top: 64px; z-index: 5; }
      .cards, .usage-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .card { padding: 13px; }
      .section-header { align-items: flex-start; flex-direction: column; gap: 6px; padding: 14px 14px 11px; }
      .filters { grid-template-columns: 1fr 1fr; padding: 14px; }
      .filter-actions { grid-column: 1 / -1; }
      .settings-grid { grid-template-columns: 1fr; padding: 3px 14px 14px; }
      .actions { align-items: stretch; flex-direction: column; padding: 12px 14px 14px; }
      .actions .button { width: 100%; }
      .key-table { min-width: 0; }
      .key-table thead { display: none; }
      .key-table, .key-table tbody, .key-table tr, .key-table td { display: block; width: 100%; }
      .key-table tr { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 12px 13px; border-top: 1px solid var(--border); }
      .key-table td { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 2px; border: 0; text-align: right; white-space: normal; }
      .key-table td::before { content: attr(data-label); color: var(--muted); font-size: .71rem; font-weight: 700; text-align: left; }
      .key-table td.identity { grid-column: 1 / -1; display: block; min-width: 0; padding-bottom: 10px; text-align: left; }
      .key-table td.identity::before { display: block; margin-bottom: 7px; }
      .key-name-input { max-width: none; }
      .key-value { max-width: calc(100vw - 100px); }
      .limit-input { width: 105px; }
    }
    @media (max-width: 440px) {
      .brand .logo { display: none; }
      .cards, .usage-summary { grid-template-columns: 1fr 1fr; }
      .filters { grid-template-columns: 1fr; }
      .filter-actions { grid-column: auto; }
      .tab { padding-inline: 13px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">$</div>
        <div>
          <h1 data-i18n="heading"></h1>
          <p class="subtitle" data-i18n="subtitle"></p>
        </div>
      </div>
      <button id="refresh" class="button secondary" type="button" data-i18n="refresh"></button>
    </header>

    <div id="session-notice" class="notice" data-i18n="waiting"></div>
    <div id="billing-disabled" class="notice error hidden" data-i18n="disabled"></div>

    <nav class="panel tabs" role="tablist" aria-label="Billing">
      <button class="tab" type="button" role="tab" aria-selected="true" data-tab="keys" data-i18n="tabKeys"></button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="usage" data-i18n="tabUsage"></button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="settings" data-i18n="tabSettings"></button>
    </nav>

    <section id="panel-keys" class="tab-panel active" role="tabpanel">
      <div class="cards">
        <article class="panel card"><span class="card-label" data-i18n="requests"></span><strong id="overview-requests" class="card-value">0</strong><div id="overview-requests-meta" class="card-meta"></div></article>
        <article class="panel card"><span class="card-label" data-i18n="totalTokens"></span><strong id="overview-tokens" class="card-value">0</strong><div class="card-meta" data-i18n="allTokenTypes"></div></article>
        <article class="panel card"><span class="card-label" data-i18n="totalCost"></span><strong id="overview-cost" class="card-value">0</strong><div id="overview-cost-meta" class="card-meta"></div></article>
        <article class="panel card"><span class="card-label" data-i18n="blockedKeys"></span><strong id="overview-blocked" class="card-value">0</strong><div id="overview-blocked-meta" class="card-meta"></div></article>
      </div>

      <form id="key-form" class="panel section">
        <div class="section-header">
          <div><h2 data-i18n="keyManagement"></h2><div class="section-hint" data-i18n="keyHint"></div></div>
          <span id="key-count" class="section-meta"></span>
        </div>
        <div id="key-table-wrap" class="table-wrap">
          <table class="key-table">
            <thead><tr>
              <th data-i18n="nameAndKey"></th>
              <th class="numeric" data-i18n="requests"></th>
              <th class="numeric" data-i18n="tokens"></th>
              <th class="numeric" data-i18n="spent"></th>
              <th class="numeric" data-i18n="limit"></th>
              <th class="numeric" data-i18n="remaining"></th>
              <th data-i18n="status"></th>
            </tr></thead>
            <tbody id="key-body"></tbody>
          </table>
        </div>
        <div id="key-empty" class="empty hidden" data-i18n="noKeys"></div>
        <div class="actions">
          <div id="key-status" class="status" role="status" aria-live="polite"></div>
          <button id="save-keys" class="button" type="submit" data-i18n="saveKeys"></button>
        </div>
      </form>
    </section>

    <section id="panel-usage" class="tab-panel" role="tabpanel">
      <form id="filters" class="panel filters">
        <label><span data-i18n="key"></span><select id="filter-key" name="key_id"></select></label>
        <label><span data-i18n="provider"></span><input id="filter-provider" name="provider" data-i18n-placeholder="providerPlaceholder"></label>
        <label><span data-i18n="model"></span><input id="filter-model" name="model" data-i18n-placeholder="modelPlaceholder"></label>
        <label><span data-i18n="from"></span><input id="filter-from" name="from" type="datetime-local"></label>
        <label><span data-i18n="to"></span><input id="filter-to" name="to" type="datetime-local"></label>
        <div class="filter-actions">
          <button class="button" type="submit" data-i18n="apply"></button>
          <button id="reset-filters" class="button secondary" type="button" data-i18n="reset"></button>
        </div>
      </form>

      <div class="cards usage-summary">
        <article class="panel card"><span class="card-label" data-i18n="matchedRequests"></span><strong id="usage-requests" class="card-value">0</strong></article>
        <article class="panel card"><span class="card-label" data-i18n="matchedTokens"></span><strong id="usage-tokens" class="card-value">0</strong></article>
        <article class="panel card"><span class="card-label" data-i18n="matchedCost"></span><strong id="usage-cost" class="card-value">0</strong></article>
      </div>

      <section class="panel section">
        <div class="section-header"><h2 data-i18n="usageByModel"></h2><span id="models-meta" class="section-meta"></span></div>
        <div class="table-wrap"><table><thead><tr><th data-i18n="provider"></th><th data-i18n="model"></th><th class="numeric" data-i18n="requests"></th><th class="numeric" data-i18n="tokens"></th><th class="numeric" data-i18n="cost"></th></tr></thead><tbody id="models-body"></tbody></table></div>
        <div id="models-empty" class="empty hidden" data-i18n="noModels"></div>
      </section>

      <section class="panel section">
        <div class="section-header"><h2 data-i18n="requestLedger"></h2><span id="events-meta" class="section-meta"></span></div>
        <div class="table-wrap"><table><thead><tr><th data-i18n="time"></th><th data-i18n="key"></th><th data-i18n="providerModel"></th><th data-i18n="status"></th><th class="numeric" data-i18n="input"></th><th class="numeric" data-i18n="output"></th><th class="numeric" data-i18n="reasoning"></th><th class="numeric" data-i18n="latency"></th><th class="numeric" data-i18n="cost"></th></tr></thead><tbody id="events-body"></tbody></table></div>
        <div id="events-empty" class="empty hidden" data-i18n="noEvents"></div>
        <div class="pagination">
          <button id="previous-page" class="button secondary" type="button" data-i18n="previous"></button>
          <span id="page-meta"></span>
          <button id="next-page" class="button secondary" type="button" data-i18n="next"></button>
        </div>
      </section>
    </section>

    <section id="panel-settings" class="tab-panel" role="tabpanel">
      <form id="settings-form" class="panel section">
        <div class="section-header">
          <div><h2 data-i18n="billingSettings"></h2><div class="section-hint" data-i18n="settingsHint"></div></div>
          <span id="settings-currency" class="section-meta">USD</span>
        </div>
        <div class="settings-grid">
          <label class="setting-toggle"><input id="settings-enabled" type="checkbox"><span><span data-i18n="enableBilling"></span><small data-i18n="enableHint"></small></span></label>
          <label><span data-i18n="defaultPrice"></span><input id="settings-default-price" type="number" min="0" step="0.000001" inputmode="decimal" required><span class="field-hint" data-i18n="defaultPriceHint"></span></label>
          <label class="setting-toggle"><input id="settings-sync" type="checkbox"><span><span data-i18n="syncEveryWrite"></span><small data-i18n="syncHint"></small></span></label>
          <label><span data-i18n="ledgerPath"></span><span id="settings-store-path" class="readonly-value"></span></label>
        </div>
        <details class="advanced">
          <summary><span data-i18n="advancedPrices"></span><small data-i18n="advancedHint"></small></summary>
          <div class="rules-toolbar"><button id="add-price-rule" class="button secondary" type="button" data-i18n="addRule"></button></div>
          <div id="rules-wrap" class="table-wrap">
            <table class="rules-table">
              <thead><tr><th data-i18n="ruleName"></th><th data-i18n="provider"></th><th data-i18n="model"></th><th class="numeric" data-i18n="inputPerM"></th><th class="numeric" data-i18n="outputPerM"></th><th class="numeric" data-i18n="reasoningPerM"></th><th class="numeric" data-i18n="cacheReadPerM"></th><th class="numeric" data-i18n="cacheCreatePerM"></th><th data-i18n="cacheMode"></th><th data-i18n="reasoningMode"></th><th></th></tr></thead>
              <tbody id="price-rules-body"></tbody>
            </table>
          </div>
          <div id="price-rules-empty" class="empty hidden" data-i18n="noRules"></div>
        </details>
        <div class="actions">
          <div id="settings-status" class="status" role="status" aria-live="polite"></div>
          <button id="save-settings" class="button" type="submit" data-i18n="saveBilling"></button>
        </div>
      </form>
    </section>

    <div id="dashboard-status" class="status" role="status" aria-live="polite"></div>
    <footer class="footer" data-i18n="footer"></footer>
  </main>

  <script nonce="{{NONCE}}">
    (() => {

      const dictionaries = { en: en, "zh-CN": zhCN, "zh-TW": zhTW, ru: ru };
      const state = {
        session: null, sessionSignature: "", language: "en", limit: 50, offset: 0,
        loading: false, overview: null, report: null, settings: null, revealedKeys: new Map()
      };
      const byId = (id) => document.getElementById(id);

      function languageKey(value) {
        const language = String(value || "").toLowerCase();
        if (language.startsWith("zh-tw") || language.startsWith("zh-hk") || language.startsWith("zh-hant")) return "zh-TW";
        if (language.startsWith("zh")) return "zh-CN";
        if (language.startsWith("ru")) return "ru";
        return "en";
      }

      function t(key, variables) {
        let value = (dictionaries[state.language] || en)[key] || en[key] || key;
        Object.entries(variables || {}).forEach(([name, replacement]) => {
          value = value.split("{" + name + "}").join(String(replacement));
        });
        return value;
      }

      function applyLanguage(value) {
        const next = languageKey(value);
        if (state.language === next && document.documentElement.dataset.billingLanguageApplied === "true") return;
        state.language = next;
        document.documentElement.dataset.billingLanguageApplied = "true";
        document.documentElement.lang = next;
        document.title = t("title");
        document.querySelector(".tabs").setAttribute("aria-label", t("heading"));
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = t(element.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
          element.placeholder = t(element.dataset.i18nPlaceholder);
        });
        if (state.settings) translateDynamicControls();
        if (state.overview) renderOverview(state.overview, false);
        if (state.report) renderUsage(state.report);
      }

      function formatNumber(value) {
        return new Intl.NumberFormat(state.language, { maximumFractionDigits: 0 }).format(Number(value || 0));
      }

      function formatDecimal(value, maximumFractionDigits) {
        const number = Number(value || 0);
        if (!Number.isFinite(number)) return String(value || 0);
        return new Intl.NumberFormat(state.language, {
          minimumFractionDigits: 2,
          maximumFractionDigits: maximumFractionDigits == null ? 9 : maximumFractionDigits
        }).format(number);
      }

      function formatMoney(value, currency) {
        return String(currency || "USD") + " " + formatDecimal(value, 9);
      }

      function localRFC3339(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "" : date.toISOString();
      }

      function setStatus(target, message, kind) {
        const element = byId(target);
        element.textContent = message || "";
        element.className = "status" + (kind ? " " + kind : "");
      }

      function setLoading(loading) {
        state.loading = loading;
        document.querySelectorAll("button:not(.reveal-button)").forEach((button) => {
          button.disabled = loading;
        });
        updatePagination();
      }

      function showSessionNotice(message, kind) {
        const notice = byId("session-notice");
        notice.textContent = message;
        notice.className = "notice" + (kind ? " " + kind : "");
        notice.classList.remove("hidden");
      }

      function reportAuthFailure() {
        state.session = null;
        state.sessionSignature = "";
        showSessionNotice(t("expired"), "error");
        window.parent.postMessage({ type: "cpa-billing-auth-invalid" }, window.location.origin);
      }

      async function requestJSON(path, options) {
        const requestOptions = options || {};
        if (!state.session) {
          const error = new Error(t("waitingError"));
          error.status = 401;
          throw error;
        }
        const headers = { Accept: "application/json" };
        headers[state.session.headerName] = state.session.headerValue;
        if (requestOptions.body !== undefined) headers["Content-Type"] = "application/json";
        const response = await fetch(state.session.apiBase + path, {
          method: requestOptions.method || "GET",
          headers: headers,
          body: requestOptions.body,
          cache: "no-store",
          credentials: "same-origin"
        });
        let payload = null;
        try { payload = await response.json(); } catch (_) { payload = null; }
        if (!response.ok) {
          const serverMessage = payload && (payload.message || (payload.error && payload.error.message) || (typeof payload.error === "string" ? payload.error : ""));
          const error = new Error(serverMessage || t("requestFailed", { status: response.status }));
          error.status = response.status;
          throw error;
        }
        return payload;
      }

      function queryParameters() {
        const params = new URLSearchParams();
        const fields = [
          ["key_id", byId("filter-key").value],
          ["provider", byId("filter-provider").value.trim()],
          ["model", byId("filter-model").value.trim()],
          ["from", localRFC3339(byId("filter-from").value)],
          ["to", localRFC3339(byId("filter-to").value)]
        ];
        fields.forEach(([name, value]) => { if (value) params.set(name, value); });
        params.set("limit", String(state.limit));
        params.set("offset", String(state.offset));
        return params;
      }

      function fetchOverview() {
        return requestJSON("/billing/usage?limit=1&offset=0");
      }

      function fetchReport() {
        return requestJSON("/billing/usage?" + queryParameters().toString());
      }

      function fetchSettings() {
        return requestJSON("/billing/settings");
      }

      function cell(row, value, className, label) {
        const td = document.createElement("td");
        if (className) td.className = className;
        if (label) td.dataset.label = label;
        td.textContent = value == null ? "" : String(value);
        row.appendChild(td);
        return td;
      }

      function badge(quota) {
        const element = document.createElement("span");
        if (quota && quota.blocked) {
          element.className = "badge blocked";
          element.textContent = t("blocked");
        } else if (quota && quota.limited) {
          element.className = "badge";
          element.textContent = t("active");
        } else {
          element.className = "badge unlimited";
          element.textContent = t("unlimited");
        }
        return element;
      }

      function keyName(key) {
        return String(key.name || key.label || "").trim();
      }

      function keyOptionText(key) {
        const name = keyName(key) || t("unnamedKey");
        return name + " · " + (key.key_preview || key.key_mask || "");
      }

      function keyDisplayText(keyID, fallbackName, fallbackMask) {
        const keys = state.settings && Array.isArray(state.settings.keys) ? state.settings.keys : [];
        const activeKey = keys.find((key) => key.key_id === keyID);
        if (activeKey) return keyName(activeKey) || activeKey.key_preview || activeKey.key_mask || t("unnamedKey");
        return fallbackName || fallbackMask || t("unnamedKey");
      }

      function renderKeyFilter(keys) {
        const select = byId("filter-key");
        const selected = select.value;
        select.replaceChildren();
        const all = document.createElement("option");
        all.value = "";
        all.textContent = t("allKeys");
        select.appendChild(all);
        keys.forEach((key) => {
          const option = document.createElement("option");
          option.value = key.key_id || "";
          option.textContent = keyOptionText(key);
          select.appendChild(option);
        });
        if (Array.from(select.options).some((option) => option.value === selected)) select.value = selected;
      }

      function translateDynamicControls() {
        const settings = state.settings;
        const keys = Array.isArray(settings.keys) ? settings.keys : [];
        const labels = [t("nameAndKey"), t("requests"), t("tokens"), t("spent"), t("limit"), t("remaining"), t("status")];
        document.querySelectorAll(".key-setting-row").forEach((row) => {
          Array.from(row.children).forEach((cell, index) => { cell.dataset.label = labels[index] || ""; });
          const key = keys.find((item) => item.key_id === row.dataset.keyId);
          const nameInput = row.querySelector(".key-name-input");
          if (nameInput) nameInput.placeholder = t("keyNamePlaceholder");
          const reveal = row.querySelector(".reveal-button");
          if (reveal && key) {
            reveal.title = state.revealedKeys.has(key.key_id) ? t("hideFull") : t("showFull");
            reveal.setAttribute("aria-label", reveal.title);
          }
          if (key) {
            if (!key.limited && row.children[5]) row.children[5].textContent = t("unlimited");
            const status = row.querySelector(".badge");
            if (status) status.replaceWith(badge(key));
          }
        });
        byId("key-count").textContent = t("configuredKeys", { count: formatNumber(keys.length) });
        renderKeyFilter(keys);
        if (!settings.store_path) byId("settings-store-path").textContent = t("defaultLedger");
        document.querySelectorAll(".remove-rule").forEach((button) => { button.textContent = t("remove"); });
        document.querySelectorAll('.price-rule-row select[data-field="input-cache-mode"], .price-rule-row select[data-field="reasoning-mode"]').forEach((select) => {
          Array.from(select.options).forEach((option) => { option.textContent = t(option.value); });
        });
        setStatus("key-status", "");
        setStatus("settings-status", "");
        setStatus("dashboard-status", "");
      }

      function usageByKeyID() {
        const result = new Map();
        const values = state.overview && Array.isArray(state.overview.by_key) ? state.overview.by_key : [];
        values.forEach((value) => result.set(value.key_id || "", value));
        return result;
      }

      function revealIcon(hidden) {
        return hidden
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.7 6.1A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-2.1 2.8M6.2 6.2C3.8 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1.5 0 2.8-.4 4-.9"/><path d="M10.2 10.2a2.5 2.5 0 0 0 3.6 3.6"/></svg>';
      }

      async function toggleReveal(button, key, valueElement) {
        const keyID = key.key_id || "";
        if (state.revealedKeys.has(keyID)) {
          state.revealedKeys.delete(keyID);
          valueElement.textContent = key.key_preview || key.key_mask || "";
          valueElement.classList.remove("revealed");
          button.innerHTML = revealIcon(true);
          button.title = t("showFull");
          button.setAttribute("aria-label", t("showFull"));
          return;
        }
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        try {
          const payload = await requestJSON("/billing/keys/" + encodeURIComponent(keyID) + "/reveal", { method: "POST" });
          if (!payload || typeof payload.key !== "string") throw new Error(t("revealFailed"));
          state.revealedKeys.set(keyID, payload.key);
          valueElement.textContent = payload.key;
          valueElement.classList.add("revealed");
          button.innerHTML = revealIcon(false);
          button.title = t("hideFull");
          button.setAttribute("aria-label", t("hideFull"));
        } catch (error) {
          if (error.status === 401 || error.status === 403) reportAuthFailure();
          setStatus("key-status", error.message || t("revealFailed"), "error");
        } finally {
          button.disabled = false;
          button.removeAttribute("aria-busy");
        }
      }

      function renderKeys(settings) {
        const keys = Array.isArray(settings.keys) ? settings.keys : [];
        const usage = usageByKeyID();
        const body = byId("key-body");
        body.replaceChildren();
        keys.forEach((key) => {
          const summary = usage.get(key.key_id || "") || {};
          const totals = summary.tokens || {};
          const row = document.createElement("tr");
          row.className = "key-setting-row";
          row.dataset.keyId = key.key_id || "";

          const identity = cell(row, "", "identity", t("nameAndKey"));
          const nameInput = document.createElement("input");
          nameInput.type = "text";
          nameInput.className = "key-name-input";
          nameInput.dataset.field = "name";
          nameInput.value = keyName(key);
          nameInput.placeholder = t("keyNamePlaceholder");
          nameInput.autocomplete = "off";
          const keyLine = document.createElement("div");
          keyLine.className = "key-line";
          const keyValue = document.createElement("code");
          keyValue.className = "key-value";
          const revealedKey = state.revealedKeys.get(key.key_id || "");
          keyValue.textContent = revealedKey || key.key_preview || key.key_mask || "";
          keyValue.classList.toggle("revealed", Boolean(revealedKey));
          keyLine.appendChild(keyValue);
          if (key.key_truncated) {
            const reveal = document.createElement("button");
            reveal.type = "button";
            reveal.className = "reveal-button";
            const revealed = state.revealedKeys.has(key.key_id || "");
            reveal.innerHTML = revealIcon(!revealed);
            reveal.title = revealed ? t("hideFull") : t("showFull");
            reveal.setAttribute("aria-label", reveal.title);
            reveal.addEventListener("click", () => toggleReveal(reveal, key, keyValue));
            keyLine.appendChild(reveal);
          }
          identity.append(nameInput, keyLine);

          cell(row, formatNumber(summary.requests), "numeric", t("requests"));
          cell(row, formatNumber(totals.total_tokens), "numeric", t("tokens"));
          cell(row, formatMoney(key.spent, settings.currency), "numeric", t("spent"));
          const limitCell = cell(row, "", "numeric", t("limit"));
          const limitInput = document.createElement("input");
          limitInput.type = "number";
          limitInput.className = "limit-input";
          limitInput.dataset.field = "limit";
          limitInput.min = "0";
          limitInput.step = "0.000001";
          limitInput.inputMode = "decimal";
          limitInput.required = true;
          limitInput.value = Number(key.limit || 0);
          limitCell.appendChild(limitInput);
          cell(row, key.limited ? formatMoney(key.remaining, settings.currency) : t("unlimited"), "numeric", t("remaining"));
          const status = cell(row, "", "", t("status"));
          status.appendChild(badge(key));
          body.appendChild(row);
        });
        byId("key-count").textContent = t("configuredKeys", { count: formatNumber(keys.length) });
        byId("key-empty").classList.toggle("hidden", keys.length !== 0);
        byId("key-table-wrap").classList.toggle("hidden", keys.length === 0);
        renderKeyFilter(keys);
      }

      function renderOverview(report, refreshKeys) {
        state.overview = report;
        const totals = report.totals || {};
        const tokens = totals.tokens || {};
        const configured = state.settings && Array.isArray(state.settings.keys) ? state.settings.keys : [];
        const blocked = configured.filter((key) => key.blocked).length;
        byId("overview-requests").textContent = formatNumber(totals.requests);
        byId("overview-requests-meta").textContent = t("requestsMeta", { success: formatNumber(totals.success), failed: formatNumber(totals.failed) });
        byId("overview-tokens").textContent = formatNumber(tokens.total_tokens);
        byId("overview-cost").textContent = formatMoney(totals.cost && totals.cost.total, report.currency);
        byId("overview-cost-meta").textContent = t("costMeta", { currency: report.currency || "USD", price: formatDecimal(report.default_price_per_million, 6) });
        byId("overview-blocked").textContent = formatNumber(blocked);
        byId("overview-blocked-meta").textContent = t("blockedMeta", { blocked: formatNumber(blocked), count: formatNumber(configured.length) });
        byId("billing-disabled").classList.toggle("hidden", report.enabled !== false);
        if (refreshKeys !== false && state.settings) renderKeys(state.settings);
      }

      function replaceRows(bodyID, emptyID, values, makeRow) {
        const body = byId(bodyID);
        body.replaceChildren();
        values.forEach((value) => body.appendChild(makeRow(value)));
        byId(emptyID).classList.toggle("hidden", values.length !== 0);
        body.closest(".table-wrap").classList.toggle("hidden", values.length === 0);
      }

      function renderUsage(report) {
        state.report = report;
        const totals = report.totals || {};
        byId("usage-requests").textContent = formatNumber(totals.requests);
        byId("usage-tokens").textContent = formatNumber(totals.tokens && totals.tokens.total_tokens);
        byId("usage-cost").textContent = formatMoney(totals.cost && totals.cost.total, report.currency);

        const models = Array.isArray(report.by_model) ? report.by_model : [];
        byId("models-meta").textContent = t("modelsMeta", { count: formatNumber(models.length) });
        replaceRows("models-body", "models-empty", models, (model) => {
          const row = document.createElement("tr");
          cell(row, model.provider || "—");
          cell(row, model.model || "—");
          cell(row, formatNumber(model.requests), "numeric");
          cell(row, formatNumber(model.tokens && model.tokens.total_tokens), "numeric");
          cell(row, formatMoney(model.cost && model.cost.total, report.currency), "numeric");
          return row;
        });

        const events = Array.isArray(report.events) ? report.events : [];
        const matched = Number(report.matched_events || 0);
        const start = events.length ? state.offset + 1 : 0;
        const end = state.offset + events.length;
        byId("events-meta").textContent = t("matchedMeta", { matched: formatNumber(matched), ledger: formatNumber(report.ledger_events) });
        byId("page-meta").textContent = t("pageMeta", { start: formatNumber(start), end: formatNumber(end), total: formatNumber(matched) });
        replaceRows("events-body", "events-empty", events, (event) => {
          const row = document.createElement("tr");
          cell(row, new Date(event.timestamp).toLocaleString(state.language));
          cell(row, keyDisplayText(event.key_id, event.key_label, event.key_mask));
          cell(row, (event.provider || "—") + " / " + (event.model || "—"));
          const statusCell = cell(row, "");
          const status = document.createElement("span");
          status.className = "badge" + (event.failed ? " blocked" : "");
          status.textContent = (event.failed ? t("failed") : t("success")) + (event.status_code ? " " + event.status_code : "");
          statusCell.appendChild(status);
          cell(row, formatNumber(event.tokens && event.tokens.input_tokens), "numeric");
          cell(row, formatNumber(event.tokens && event.tokens.output_tokens), "numeric");
          cell(row, formatNumber(event.tokens && event.tokens.reasoning_tokens), "numeric");
          cell(row, formatNumber(event.latency_ms) + " ms", "numeric");
          cell(row, formatMoney(event.cost && event.cost.total, report.currency), "numeric");
          return row;
        });
        updatePagination();
      }

      function updatePagination() {
        if (!state.report) return;
        const events = Array.isArray(state.report.events) ? state.report.events : [];
        const end = state.offset + events.length;
        byId("previous-page").disabled = state.loading || state.offset === 0;
        byId("next-page").disabled = state.loading || end >= Number(state.report.matched_events || 0);
      }

      function priceInput(value, field) {
        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.step = "0.000001";
        input.required = true;
        input.dataset.field = field;
        input.value = Number(value || 0);
        return input;
      }

      function textInput(value, field, placeholder) {
        const input = document.createElement("input");
        input.type = "text";
        input.dataset.field = field;
        input.value = value || "";
        input.placeholder = placeholder || "";
        return input;
      }

      function modeSelect(value, field) {
        const select = document.createElement("select");
        select.dataset.field = field;
        ["auto", "included", "additional"].forEach((mode) => {
          const option = document.createElement("option");
          option.value = mode;
          option.textContent = t(mode);
          option.selected = (value || "auto") === mode;
          select.appendChild(option);
        });
        return select;
      }

      function controlCell(row, control, className) {
        const target = cell(row, "", className);
        target.appendChild(control);
      }

      function appendPriceRule(rule) {
        const value = rule || {};
        const row = document.createElement("tr");
        row.className = "price-rule-row";
        controlCell(row, textInput(value.name, "name", t("ruleName")));
        controlCell(row, textInput(value.provider || "*", "provider", "*"));
        controlCell(row, textInput(value.model || "*", "model", "*"));
        [
          ["input-per-million", value["input-per-million"]],
          ["output-per-million", value["output-per-million"]],
          ["reasoning-per-million", value["reasoning-per-million"]],
          ["cache-read-per-million", value["cache-read-per-million"]],
          ["cache-creation-per-million", value["cache-creation-per-million"]]
        ].forEach(([field, amount]) => controlCell(row, priceInput(amount, field), "numeric"));
        controlCell(row, modeSelect(value["input-cache-mode"], "input-cache-mode"));
        controlCell(row, modeSelect(value["reasoning-mode"], "reasoning-mode"));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-rule";
        remove.textContent = t("remove");
        remove.addEventListener("click", () => {
          row.remove();
          updateRulesEmptyState();
        });
        controlCell(row, remove);
        byId("price-rules-body").appendChild(row);
        updateRulesEmptyState();
      }

      function updateRulesEmptyState() {
        const empty = byId("price-rules-body").children.length === 0;
        byId("price-rules-empty").classList.toggle("hidden", !empty);
        byId("rules-wrap").classList.toggle("hidden", empty);
      }

      function renderPriceRules(prices) {
        byId("price-rules-body").replaceChildren();
        (Array.isArray(prices) ? prices : []).forEach((rule) => appendPriceRule(rule));
        updateRulesEmptyState();
      }

      function renderBillingControls(settings) {
        byId("settings-enabled").checked = settings.enabled === true;
        byId("settings-sync").checked = settings.sync_on_write === true;
        byId("settings-default-price").value = Number(settings.default_price_per_million == null ? 1 : settings.default_price_per_million);
        byId("settings-currency").textContent = settings.currency || "USD";
        byId("settings-store-path").textContent = settings.store_path || t("defaultLedger");
        renderPriceRules(settings.prices);
      }

      function renderSettings(settings) {
        state.settings = settings;
        state.revealedKeys.clear();
        renderBillingControls(settings);
        renderKeys(settings);
      }

      function nonNegativeNumber(input, field) {
        const value = input.valueAsNumber;
        if (!Number.isFinite(value) || value < 0) {
          input.focus();
          throw new Error(t("numberError", { field: field }));
        }
        return value;
      }

      function validateName(input) {
        const value = input.value.trim();
        const invalidControl = /[\u0000-\u001f\u007f-\u009f]/.test(value);
        if (invalidControl || new TextEncoder().encode(value).length > 128) {
          input.focus();
          throw new Error(t("nameError"));
        }
        return value;
      }

      function collectKeys() {
        return Array.from(document.querySelectorAll(".key-setting-row")).map((row) => ({
          key_id: row.dataset.keyId,
          name: validateName(row.querySelector('[data-field="name"]')),
          limit: nonNegativeNumber(row.querySelector('[data-field="limit"]'), t("keyLimitField"))
        }));
      }

      function persistedKeys() {
        return (state.settings && Array.isArray(state.settings.keys) ? state.settings.keys : []).map((key) => ({
          key_id: key.key_id,
          name: keyName(key),
          limit: Number(key.limit || 0)
        }));
      }

      function collectPrices() {
        return Array.from(document.querySelectorAll(".price-rule-row")).map((row, index) => {
          const field = (name) => row.querySelector('[data-field="' + name + '"]');
          const price = (name, label) => nonNegativeNumber(field(name), t("rulePriceField", { index: index + 1, field: label }));
          return {
            name: field("name").value.trim(),
            provider: field("provider").value.trim() || "*",
            model: field("model").value.trim() || "*",
            "input-per-million": price("input-per-million", t("input")),
            "output-per-million": price("output-per-million", t("output")),
            "reasoning-per-million": price("reasoning-per-million", t("reasoning")),
            "cache-read-per-million": price("cache-read-per-million", t("cacheReadPerM")),
            "cache-creation-per-million": price("cache-creation-per-million", t("cacheCreatePerM")),
            "input-cache-mode": field("input-cache-mode").value,
            "reasoning-mode": field("reasoning-mode").value
          };
        });
      }

      function keySettingsPayload() {
        return {
          enabled: state.settings.enabled === true,
          sync_on_write: state.settings.sync_on_write === true,
          default_price_per_million: Number(state.settings.default_price_per_million == null ? 1 : state.settings.default_price_per_million),
          prices: Array.isArray(state.settings.prices) ? state.settings.prices : [],
          keys: collectKeys()
        };
      }

      function billingSettingsPayload() {
        return {
          enabled: byId("settings-enabled").checked,
          sync_on_write: byId("settings-sync").checked,
          default_price_per_million: nonNegativeNumber(byId("settings-default-price"), t("defaultPriceField")),
          prices: collectPrices(),
          keys: persistedKeys()
        };
      }

      async function reloadAll(initial) {
        if (state.loading) return;
        setLoading(true);
        setStatus("dashboard-status", t(initial ? "connecting" : "refreshing"));
        try {
          const results = await Promise.all([fetchOverview(), fetchReport(), fetchSettings()]);
          state.overview = results[0];
          renderSettings(results[2]);
          renderOverview(results[0], false);
          renderUsage(results[1]);
          byId("session-notice").classList.add("hidden");
          setStatus("dashboard-status", t("updatedAt", { time: new Date().toLocaleTimeString(state.language) }), "success");
        } catch (error) {
          if (error.status === 401 || error.status === 403) {
            reportAuthFailure();
            setStatus("dashboard-status", t("sessionUnavailable"), "error");
          } else {
            setStatus("dashboard-status", error.message || t("loadFailed"), "error");
          }
        } finally {
          setLoading(false);
        }
      }

      async function reloadUsage() {
        if (state.loading) return;
        setLoading(true);
        setStatus("dashboard-status", t("refreshing"));
        try {
          renderUsage(await fetchReport());
          setStatus("dashboard-status", t("updatedAt", { time: new Date().toLocaleTimeString(state.language) }), "success");
        } catch (error) {
          if (error.status === 401 || error.status === 403) reportAuthFailure();
          setStatus("dashboard-status", error.message || t("loadFailed"), "error");
        } finally {
          setLoading(false);
        }
      }

      async function save(payload, statusTarget, scope) {
        if (state.loading) return;
        setLoading(true);
        setStatus(statusTarget, t("saving"));
        try {
          const settings = await requestJSON("/billing/settings", { method: "PUT", body: JSON.stringify(payload()) });
          const overview = await fetchOverview();
          state.settings = settings;
          state.overview = overview;
          state.revealedKeys.clear();
          if (scope === "keys") renderKeys(settings);
          else renderBillingControls(settings);
          renderOverview(overview, false);
          if (scope === "keys" && state.report) renderUsage(state.report);
          setStatus(statusTarget, t("savedAt", { time: new Date().toLocaleTimeString(state.language) }), "success");
        } catch (error) {
          if (error.status === 401 || error.status === 403) reportAuthFailure();
          setStatus(statusTarget, error.message || t("saveFailed"), "error");
        } finally {
          setLoading(false);
        }
      }

      function activateTab(tabName) {
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.setAttribute("aria-selected", String(tab.dataset.tab === tabName));
        });
        document.querySelectorAll(".tab-panel").forEach((panel) => {
          panel.classList.toggle("active", panel.id === "panel-" + tabName);
        });
      }

      document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => activateTab(tab.dataset.tab)));
      byId("refresh").addEventListener("click", () => {
        state.offset = 0;
        reloadAll(false);
      });
      byId("key-form").addEventListener("submit", (event) => {
        event.preventDefault();
        save(keySettingsPayload, "key-status", "keys");
      });
      byId("settings-form").addEventListener("submit", (event) => {
        event.preventDefault();
        save(billingSettingsPayload, "settings-status", "settings");
      });
      byId("filters").addEventListener("submit", (event) => {
        event.preventDefault();
        state.offset = 0;
        reloadUsage();
      });
      byId("reset-filters").addEventListener("click", () => {
        byId("filters").reset();
        state.offset = 0;
        reloadUsage();
      });
      byId("previous-page").addEventListener("click", () => {
        state.offset = Math.max(0, state.offset - state.limit);
        reloadUsage();
      });
      byId("next-page").addEventListener("click", () => {
        state.offset += state.limit;
        reloadUsage();
      });
      byId("add-price-rule").addEventListener("click", () => appendPriceRule({}));

      function applyTheme(theme) {
        if (!theme || typeof theme !== "object") return;
        const variables = theme.variables && typeof theme.variables === "object" ? theme.variables : {};
        Object.entries(variables).forEach(([name, value]) => {
          if (name.startsWith("--") && typeof value === "string") document.documentElement.style.setProperty(name, value);
        });
        if (typeof theme.language === "string" && theme.language) applyLanguage(theme.language);
        if (typeof theme.colorScheme === "string" && theme.colorScheme) document.documentElement.style.colorScheme = theme.colorScheme;
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;
        if (!event.data || event.data.type !== "cpa-billing-context") return;
        applyTheme(event.data.theme);
        const session = event.data.session;
        if (!session || typeof session.apiBase !== "string" || typeof session.headerName !== "string" || typeof session.headerValue !== "string") {
          showSessionNotice(t("waiting"));
          return;
        }
        const signature = session.apiBase + "\n" + session.headerName + "\n" + session.headerValue;
        if (signature === state.sessionSignature) return;
        state.session = {
          apiBase: session.apiBase.replace(/\/$/, ""),
          headerName: session.headerName,
          headerValue: session.headerValue
        };
        state.sessionSignature = signature;
        state.offset = 0;
        reloadAll(true);
      });

      const initialLanguage = new URLSearchParams(window.location.search).get("lang") || navigator.language || "en";
      applyLanguage(initialLanguage);
      activateTab("keys");
      window.parent.postMessage({ type: "cpa-billing-ready" }, window.location.origin);
    })();
  </script>
</body>
</html>
